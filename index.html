<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
/* Restrict pinch zoom only when AXON is running as an installed app.
   Regular browser tabs retain their native zoom controls. */
(function () {
  var isInstalledApp =
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    window.navigator.standalone === true;

  if (!isInstalledApp) return;

  document.documentElement.classList.add("axon-installed-app");
  var viewport = document.querySelector('meta[name="viewport"]');
  if (viewport) {
    viewport.setAttribute(
      "content",
      "width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    );
  }
})();
</script>
<meta name="theme-color" content="#ffffff" id="metaThemeColor">
<meta name="color-scheme" content="light dark">
<meta name="description" content="AXON AI — your personal AI assistant. Chat, attach images and MP4 videos, and talk with AXON.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AXON">
<title>AXON AI</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/axon-icon-192.png">
<link rel="icon" type="image/png" href="./assets/axon-icon-192.png">
<!-- Fetch the Generate Instant artwork before the user opens that screen. -->
<link rel="preload" as="image" href="./generate-instant-bg.png" fetchpriority="high">
<script>
/* Apply the saved theme before first paint to avoid a white flash. */
(function () {
  try {
    var saved = localStorage.getItem("axon_theme") || "light";
    var dark = saved === "dark" ||
      (saved === "system" &&
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) document.documentElement.classList.add("dark-preload");
    document.documentElement.dataset.theme = saved;
  } catch (e) {}
})();
</script>
