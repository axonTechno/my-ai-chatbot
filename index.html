
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>AXON</title>

<style>
:root{
  --bg:#090914;
  --panel:#111120;
  --panel2:#1b1930;
  --purple:#9875ff;
  --pink:#ff65c8;
  --text:#f4f1ff;
  --muted:#9290aa;
  --border:#292640;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);color:var(--text);
}
body{height:100dvh;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
.app{height:100dvh;display:flex}

.sidebar{
  width:280px;flex-shrink:0;background:#0d0d1a;
  border-right:1px solid var(--border);
  padding:20px 14px;display:flex;flex-direction:column;
  position:fixed;z-index:20;top:0;bottom:0;left:0;
  transform:translateX(-105%);
  transition:transform .28s ease;
  box-shadow:15px 0 40px #0005;
}
.sidebar.open{transform:translateX(0)}
.drawer-shade{
  position:fixed;inset:0;z-index:19;background:#0009;
  opacity:0;visibility:hidden;transition:.25s;
}
.drawer-shade.show{opacity:1;visibility:visible}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 24px}
.logo{width:38px;height:38px;object-fit:contain}
.brand strong{font-size:21px;letter-spacing:3px}
.newchat{
  border:1px solid #44366b;background:#1b1730;
  border-radius:12px;padding:12px;text-align:left;
  color:#cbbcff;width:100%;
}
.newchat:hover{background:#29213f}
.sideheading{
  font-size:11px;color:var(--muted);
  padding:24px 9px 9px;letter-spacing:1px;
}
.history{overflow:auto;flex:1;min-height:0}
.chatitem{
  width:100%;border:0;background:transparent;text-align:left;
  color:#c9c5db;padding:11px 10px;border-radius:9px;
  font-size:13px;display:flex;align-items:center;gap:7px;
}
.chatitem:hover,.chatitem.active{background:var(--panel2)}
.chat-title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.delete-chat{
  border:0;background:transparent;color:#a39bb8;
  padding:5px;border-radius:7px;font-size:13px;flex-shrink:0;
}
.delete-chat:hover{background:#46233b;color:#ff8bd4}
.sidebottom{border-top:1px solid var(--border);padding-top:12px}

.main{
  flex:1;min-width:0;display:flex;flex-direction:column;width:100%;
}
.topbar{
  height:62px;flex-shrink:0;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar span{font-size:13px;color:var(--muted)}
.status{color:#9de6bd!important;font-size:11px!important}
.iconbtn{
  border:0;background:transparent;padding:8px;
  font-size:20px;border-radius:8px;
}
.iconbtn:hover{background:var(--panel2)}

.messages{
  flex:1;min-height:0;overflow-y:auto;padding:28px 18px 20px;
  display:flex;flex-direction:column;gap:22px;
  overscroll-behavior:contain;
}
.welcome{margin:auto;text-align:center;max-width:500px;padding:25px 10px}
.biglogo{
  width:110px;height:110px;object-fit:contain;margin:0 auto 22px;
  filter:drop-shadow(0 0 17px #9875ff77);
  animation:logo-arrive 1.25s cubic-bezier(.2,.8,.2,1) both,
            glow 2.5s 1.25s infinite alternate;
}
@keyframes logo-arrive{
  0%{opacity:0;transform:translateY(24px) rotate(-38deg) scale(.28)}
  65%{opacity:1;transform:translateY(-5px) rotate(375deg) scale(1.12)}
  82%{transform:translateY(2px) rotate(354deg) scale(.97)}
  100%{opacity:1;transform:translateY(0) rotate(360deg) scale(1)}
}
@keyframes glow{to{filter:drop-shadow(0 0 24px #9875ff)}}
.welcome h1{font-size:34px;letter-spacing:5px;margin:0 0 12px}
.welcome p{color:var(--muted);font-size:14px;line-height:1.7}
.suggestions{
  display:flex;gap:9px;justify-content:center;
  flex-wrap:wrap;margin-top:25px;
}
.suggestions button{
  background:var(--panel);border:1px solid var(--border);
  padding:10px 13px;border-radius:20px;color:#c9baff;font-size:12px;
}
.suggestions button:hover{border-color:var(--purple);background:#201a36}

.message{
  max-width:850px;width:100%;margin:0 auto;
  display:flex;align-items:flex-start;gap:11px;
  line-height:1.7;position:relative;
}
.message.user{justify-content:flex-end}
.message.assistant{justify-content:flex-start}
.avatar{
  width:36px;height:36px;flex-shrink:0;border-radius:50%;
  display:grid;place-items:center;overflow:hidden;background:#28203e;
}
.avatar img{width:100%;height:100%;object-fit:contain;padding:4px}
.user-avatar{
  background:linear-gradient(145deg,#35264f,#171526);
  border:1px solid #51416f;
}
.avatar.user-avatar img{object-fit:cover;padding:0}
.content-wrap{
  max-width:min(78%,680px);min-width:0;
  display:flex;flex-direction:column;align-items:flex-start;position:relative;
}
.user .content-wrap{align-items:flex-end}
.content{
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;
  padding:11px 15px;border-radius:16px;
  background:#151527;border:1px solid #292640;
}
.user .content{
  background:linear-gradient(140deg,#28203f,#211c36);
  border-color:#493b68;border-bottom-right-radius:5px;
}
.assistant .content{border-bottom-left-radius:5px}
.message-actions{
  display:flex;gap:6px;margin-top:5px;
  opacity:0;visibility:hidden;transform:translateY(4px);transition:.18s;
}
.message.show-actions .message-actions{
  opacity:1;visibility:visible;transform:translateY(0);
}
.message-actions button{
  border:1px solid #44345f;background:#201831;
  border-radius:15px;padding:4px 10px;font-size:12px;color:#c7b9e8;
}
.message-actions button.selected{
  background:#45234c;border-color:var(--pink);color:#ff9bd9;
}
.message-actions button.dislike.selected{
  background:#302448;border-color:#a98bff;color:#c5adff;
}

.composer-area{flex-shrink:0;padding:12px 18px 18px}
.composer{
  max-width:850px;margin:auto;background:#141425;
  border:1px solid #393451;border-radius:20px;padding:12px;
  display:flex;align-items:flex-end;gap:10px;box-shadow:0 8px 35px #0005;
}
textarea{
  flex:1;resize:none;max-height:140px;min-height:27px;
  border:0;outline:0;background:transparent;color:var(--text);
  padding:8px 5px;font-size:14px;
}
textarea::placeholder{color:#77748e}
.send{
  width:42px;height:42px;min-width:42px;border:0;border-radius:50%;
  background:linear-gradient(135deg,#ff65c8,#a855f7,#7045ff);
  color:white;font-size:23px;font-weight:600;
  display:grid;place-items:center;
}
.send:disabled{opacity:.5;cursor:not-allowed}
.note{text-align:center;color:#74718a;font-size:10px;padding-top:10px}
.typing{color:#b8a4ef;font-size:13px;padding:8px 2px}

.overlay{
  position:fixed;inset:0;background:#000b;display:none;
  align-items:center;justify-content:center;padding:18px;z-index:30;
}
.overlay.show{display:flex}
.modal{
  width:100%;max-width:420px;max-height:88dvh;overflow:auto;
  background:#151527;border:1px solid var(--border);
  border-radius:18px;padding:22px;box-shadow:0 18px 60px #0008;
}
.modal h2{margin:0 0 8px}
.modal p{color:var(--muted);font-size:13px}
.modal label{font-size:12px;color:#aaa}
.modal input,.modal select{
  width:100%;padding:11px;background:#090914;color:white;
  border:1px solid var(--border);border-radius:9px;margin-top:8px;
}
.modal select{outline:none}
.modal option{background:#151527;color:white}
.setting-section{margin-top:22px;padding-top:17px;border-top:1px solid var(--border)}
.avatar-options{display:flex;gap:12px;margin-top:12px}
.avatar-option{
  flex:1;background:#100f20;border:1px solid var(--border);
  border-radius:13px;padding:14px 8px;display:flex;
  flex-direction:column;align-items:center;gap:8px;color:#cfc9e4;
}
.avatar-option.selected{
  border-color:var(--pink);background:#281b35;
  box-shadow:0 0 15px #ff65c822;
}
.avatar-preview{
  width:55px;height:55px;border-radius:50%;
  overflow:hidden;background:linear-gradient(145deg,#453064,#191629);
  border:1px solid #5d477d;
}
.avatar-preview img{width:100%;height:100%;object-fit:cover;display:block}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.modal button.action{
  background:var(--panel2);border:1px solid var(--border);
  padding:10px 14px;border-radius:9px;margin-top:12px;
}
.modal button.action.primary{
  background:linear-gradient(120deg,#7146b9,#9b4cc1);border:0;
}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}
.info-row span:first-child{color:var(--muted)}
.info-row span:last-child{color:#e5d8ff}
.danger{color:#ff8fbd!important;border-color:#713552!important}
.setting-error{color:#ff8fbd;font-size:12px;margin-top:8px}

@media(max-width:650px){
  .topbar{padding:0 12px}
  .messages{padding:22px 12px}
  .composer-area{padding:10px 12px 15px}
  .welcome h1{font-size:29px}
  .content-wrap{max-width:84%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>
<div class="drawer-shade" id="drawerShade" onclick="closeSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="logo" src="axon-logo.png" alt="AXON logo">
      <strong>AXON</strong>
    </div>
    <button class="newchat" onclick="newChat()">＋ New chat</button>
    <div class="sideheading">YOUR CONVERSATIONS</div>
    <div class="history" id="history"></div>
    <div class="sidebottom">
      <button class="chatitem" onclick="openSettings()">
        <span>⚙</span><span class="chat-title">Settings</span>
      </button>
      <button class="chatitem danger" onclick="deleteAllChats()">
        <span>♲</span><span class="chat-title">Delete all chats</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="iconbtn" onclick="toggleSidebar()" aria-label="Open dashboard">☰</button>
        <span>AXON / AI Chat</span>
      </div>
      <span class="status">● AI CHAT</span>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-area">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message AXON..."
          oninput="resizeInput(this)" onkeydown="handleKey(event)"></textarea>
        <button class="send" id="send" onclick="sendMessage()" aria-label="Send message">↑</button>
      </div>
      <div class="note">AXON can make mistakes. Verify important information.</div>
    </div>
  </main>
</div>

<div class="overlay" id="settings" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>Settings</h2>
    <p>Personalize your AXON experience.</p>

    <div class="setting-section">
      <label>CHANGE AVATAR</label>
      <p>Select your chat profile avatar.</p>
      <div class="avatar-options">
        <button class="avatar-option" id="maleOption" onclick="selectAvatar('male')">
          <span class="avatar-preview"><img src="male-avatar.png" alt="Male avatar"></span>
          <strong>Male</strong><small>Boy avatar</small>
        </button>
        <button class="avatar-option" id="femaleOption" onclick="selectAvatar('female')">
          <span class="avatar-preview"><img src="female-avatar.png" alt="Female avatar"></span>
          <strong>Female</strong><small>Girl avatar</small>
        </button>
      </div>
      <div id="avatarStatus" class="setting-error"></div>
    </div>

    <div class="setting-section">
      <label for="responseLanguage">RESPONSE LANGUAGE</label>
      <p>Choose the language AXON should use in replies.</p>
      <select id="responseLanguage">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Korean">한국어 (Korean)</option>
        <option value="Tamil">தமிழ் (Tamil)</option>
        <option value="Urdu">اردو (Urdu)</option>
        <option value="Hinglish">Hinglish</option>
      </select>
    </div>

    <div class="setting-section">
      <label for="workerUrl">AI WORKER URL</label>
      <input id="workerUrl" type="url" placeholder="Your Cloudflare Worker URL">
    </div>

    <div class="setting-section">
      <label>ABOUT AXON</label>
      <div class="info-row"><span>Designer</span><span>Rachit</span></div>
      <div class="info-row"><span>AI Model</span><span>Meta</span></div>
      <div class="info-row"><span>Product</span><span>AXON AI Chat</span></div>
    </div>

    <div class="modal-actions">
      <button class="action primary" onclick="saveSettings()">Save settings</button>
      <button class="action" onclick="closeSettings()">Close</button>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const CHAT_KEY = "axon_chats";
const URL_KEY = "axon_worker_url";
const AVATAR_KEY = "axon_user_avatar";
const LANGUAGE_KEY = "axon_response_language";

const supportedLanguages = [
  "English",
  "Hindi",
  "Korean",
  "Tamil",
  "Urdu",
  "Hinglish"
];

function loadChats(){
  try{
    const saved = JSON.parse(localStorage.getItem(CHAT_KEY) || "[]");
    return Array.isArray(saved)
      ? saved.filter(c => c && Array.isArray(c.messages))
      : [];
  }catch(error){
    console.warn("Could not load chats:",error);
    return [];
  }
}

let chats = loadChats();
let currentId = null;
let busy = false;
let selectedAvatar = localStorage.getItem(AVATAR_KEY) === "female" ? "female" : "male";
let pendingAvatar = selectedAvatar;

function getSelectedLanguage(){
  const language = localStorage.getItem(LANGUAGE_KEY) || "English";
  return supportedLanguages.includes(language) ? language : "English";
}

function save(){
  try{
    localStorage.setItem(CHAT_KEY,JSON.stringify(chats));
  }catch(error){
    console.error("Save error:",error);
  }
}

function currentChat(){
  return chats.find(c => c.id === currentId) || null;
}

function createChat(){
  const chat = {id:Date.now(),title:"New conversation",messages:[]};
  chats.unshift(chat);
  currentId = chat.id;
  return chat;
}

function newChat(){
  if(busy)return;
  currentId = null;
  $("input").value = "";
  resizeInput($("input"));
  renderMessages();
  renderHistory();
  closeSidebar();
  $("input").focus();
}

function selectChat(id){
  if(busy)return;
  currentId = id;
  renderMessages();
  renderHistory();
  closeSidebar();
}

function deleteChat(id){
  if(busy)return;
  const chat = chats.find(c => c.id === id);
  if(!chat || !confirm("Delete this conversation permanently?"))return;
  chats = chats.filter(c => c.id !== id);
  if(currentId === id)currentId = null;
  save();
  renderHistory();
  renderMessages();
}

function deleteAllChats(){
  if(busy)return;
  if(!chats.length){alert("No recent chats to delete.");return;}
  if(!confirm("Delete ALL recent conversations? This cannot be undone."))return;
  chats = [];
  currentId = null;
  save();
  renderHistory();
  renderMessages();
  closeSidebar();
}

function renderHistory(){
  const history = $("history");
  history.replaceChildren();

  if(!chats.length){
    const empty = document.createElement("div");
    empty.textContent = "No recent chats";
    empty.style.cssText = "color:#77748e;font-size:12px;padding:12px";
    history.appendChild(empty);
  }

  chats.forEach(chat => {
    const row = document.createElement("div");
    row.className = "chatitem" + (chat.id === currentId ? " active" : "");

    const title = document.createElement("span");
    title.className = "chat-title";
    title.textContent = "▢  " + (chat.title || "New conversation");
    title.onclick = () => selectChat(chat.id);

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.textContent = "✕";
    del.title = "Delete conversation";
    del.onclick = event => {
      event.stopPropagation();
      deleteChat(chat.id);
    };

    row.append(title,del);
    history.appendChild(row);
  });
}

function welcomeMarkup(){
  return `
    <div class="welcome">
      <img class="biglogo" src="axon-logo.png" alt="AXON">
      <h1>AXON</h1>
      <p>Your AI conversation space.<br>
      Ask anything. Explore ideas. Learn something new.</p>
      <div class="suggestions">
        <button onclick="suggest('Explain artificial intelligence simply')">Explore AI</button>
        <button onclick="suggest('Help me learn coding')">Learn coding</button>
        <button onclick="suggest('Tell me an interesting science fact')">Science fact</button>
      </div>
    </div>`;
}

function makeAvatar(role){
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  const img = document.createElement("img");

  if(role === "assistant"){
    img.src = "axon-logo.png";
    img.alt = "AXON";
  }else{
    avatar.classList.add("user-avatar");
    img.src = selectedAvatar === "female" ? "female-avatar.png" : "male-avatar.png";
    img.alt = selectedAvatar === "female" ? "Female avatar" : "Male avatar";
  }

  img.onerror = () => {
    img.style.display = "none";
    const fallback = document.createElement("span");
    fallback.textContent = role === "assistant" ? "A" : "U";
    fallback.style.color = "#d9caff";
    avatar.appendChild(fallback);
  };

  avatar.appendChild(img);
  return avatar;
}

function renderMessages(){
  const area = $("messages");
  area.replaceChildren();
  const chat = currentChat();

  if(!chat || !chat.messages.length){
    area.innerHTML = welcomeMarkup();
    return;
  }

  chat.messages.forEach((message,index) => {
    addMessage(message.role,message.text,false,message,index);
  });

  area.scrollTop = area.scrollHeight;
}

function addMessage(role,text,scroll=true,messageData=null){
  const row = document.createElement("div");
  row.className = "message " + role;
  const avatar = makeAvatar(role);
  const wrap = document.createElement("div");
  wrap.className = "content-wrap";
  const content = document.createElement("div");
  content.className = "content";
  content.textContent = text;
  wrap.appendChild(content);

  if(role === "assistant" && messageData){
    const actions = document.createElement("div");
    actions.className = "message-actions";
    const like = document.createElement("button");
    like.textContent = "♥ Like";
    like.className = messageData.feedback === "like" ? "selected" : "";
    const dislike = document.createElement("button");
    dislike.textContent = "♥ Unlike";
    dislike.className = "dislike " + (messageData.feedback === "dislike" ? "selected" : "");

    like.onclick = () => setFeedback(messageData,"like",like,dislike);
    dislike.onclick = () => setFeedback(messageData,"dislike",like,dislike);

    actions.append(like,dislike);
    wrap.appendChild(actions);

    let pressTimer;
    const startPress = () => {
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => row.classList.add("show-actions"),450);
    };
    const cancelPress = () => clearTimeout(pressTimer);

    content.addEventListener("pointerdown",startPress);
    content.addEventListener("pointerup",cancelPress);
    content.addEventListener("pointerleave",cancelPress);
    content.addEventListener("pointercancel",cancelPress);
    content.addEventListener("contextmenu",event => {
      event.preventDefault();
      row.classList.add("show-actions");
    });
  }

  if(role === "user")row.append(wrap,avatar);
  else row.append(avatar,wrap);

  $("messages").appendChild(row);

  if(scroll)$("messages").scrollTop = $("messages").scrollHeight;
  return content;
}

function setFeedback(message,value,likeButton,dislikeButton){
  message.feedback = message.feedback === value ? null : value;
  likeButton.classList.toggle("selected",message.feedback === "like");
  dislikeButton.classList.toggle("selected",message.feedback === "dislike");
  save();
}

function suggest(text){
  $("input").value = text;
  sendMessage();
}

function resizeInput(element){
  element.style.height = "auto";
  element.style.height = Math.min(element.scrollHeight,140) + "px";
}

function handleKey(event){
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

async function sendMessage(){
  if(busy)return;
  const input = $("input");
  const text = input.value.trim();
  if(!text)return;

  const url = (localStorage.getItem(URL_KEY) || "").trim();

  if(!url){
    openSettings();
    alert("First add your Cloudflare Worker URL in Settings.");
    return;
  }

  if(!/^https:\/\/.+/i.test(url)){
    alert("Please enter a valid HTTPS Worker URL.");
    openSettings();
    return;
  }

  let chat = currentChat();
  if(!chat)chat = createChat();

  const userMessage = {role:"user",text};
  chat.messages.push(userMessage);

  if(chat.messages.length === 1){
    chat.title = text.length > 32 ? text.slice(0,32) + "…" : text;
  }

  input.value = "";
  resizeInput(input);
  save();
  renderHistory();
  renderMessages();

  busy = true;
  $("send").disabled = true;

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "AXON is thinking…";
  $("messages").appendChild(typing);
  $("messages").scrollTop = $("messages").scrollHeight;

  try{
    const apiMessages = chat.messages.map(m => ({
      role:m.role,
      content:m.text
    }));

    const selectedLanguage = getSelectedLanguage();

    const response = await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages:apiMessages,
        language:selectedLanguage
      })
    });

    let data;

    try{
      data = await response.json();
    }catch(parseError){
      throw new Error("Worker returned an invalid response.");
    }

    if(!response.ok){
      throw new Error(data.details || data.error || `Server error (${response.status})`);
    }

    const answer = data.response || data.result || data.output;

    if(typeof answer !== "string" || !answer.trim()){
      throw new Error(data.error || "AXON received an empty response.");
    }

    chat.messages.push({role:"assistant",text:answer.trim()});
    save();

  }catch(error){
    console.error("AXON request failed:",error);

    chat.messages.push({
      role:"assistant",
      text:"AXON Error: " + (error.message || "Something went wrong. Please try again.")
    });

    save();

  }finally{
    busy = false;
    $("send").disabled = false;
    renderMessages();
    renderHistory();
    input.focus();
  }
}

function openSettings(){
  pendingAvatar = selectedAvatar;

  $("workerUrl").value = localStorage.getItem(URL_KEY) || "";
  $("responseLanguage").value = getSelectedLanguage();

  updateAvatarOptions();
  $("avatarStatus").textContent = "";
  $("settings").classList.add("show");
}

function closeSettings(){
  $("settings").classList.remove("show");
}

function selectAvatar(value){
  pendingAvatar = value;
  updateAvatarOptions();
}

function updateAvatarOptions(){
  $("maleOption").classList.toggle("selected",pendingAvatar === "male");
  $("femaleOption").classList.toggle("selected",pendingAvatar === "female");
}

function saveSettings(){
  const url = $("workerUrl").value.trim();

  if(url && !/^https:\/\/.+/i.test(url)){
    $("avatarStatus").textContent = "Worker URL must begin with https://";
    return;
  }

  if(url){
    try{
      const parsed = new URL(url);
      if(parsed.protocol !== "https:")throw new Error("Invalid protocol");
    }catch(error){
      $("avatarStatus").textContent = "Please enter a valid Worker URL.";
      return;
    }
  }

  const language = $("responseLanguage").value;

  if(!supportedLanguages.includes(language)){
    $("avatarStatus").textContent = "Please select a supported language.";
    return;
  }

  localStorage.setItem(URL_KEY,url);
  localStorage.setItem(LANGUAGE_KEY,language);

  selectedAvatar = pendingAvatar;
  localStorage.setItem(AVATAR_KEY,selectedAvatar);

  closeSettings();
  renderMessages();
  alert("Settings saved successfully.");
}

function toggleSidebar(){
  $("sidebar").classList.toggle("open");
  $("drawerShade").classList.toggle("show");
}

function closeSidebar(){
  $("sidebar").classList.remove("open");
  $("drawerShade").classList.remove("show");
}

document.addEventListener("keydown",event => {
  if(event.key === "Escape"){
    closeSidebar();
    closeSettings();
  }
});

function init(){
  renderHistory();
  renderMessages();
}

init();
</script>
</body>
</html>
