
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>AXON</title>

<style>
:root{
  --bg:#090914;
  --panel:#111120;
  --panel2:#1b1930;
  --purple:#9875ff;
  --pink:#ff65c8;
  --text:#f4f1ff;
  --muted:#9290aa;
  --border:#292640;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}

.app{height:100dvh;display:flex}

.sidebar{
  width:270px;
  flex-shrink:0;
  background:#0d0d1a;
  border-right:1px solid var(--border);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  transition:left .25s;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 8px 24px;
}

.logo{
  width:38px;
  height:38px;
  object-fit:contain;
}

.brand strong{
  font-size:21px;
  letter-spacing:3px;
}

.newchat{
  border:1px solid #44366b;
  background:#1b1730;
  border-radius:12px;
  padding:12px;
  text-align:left;
  color:#cbbcff;
  width:100%;
}

.newchat:hover{background:#29213f}

.sideheading{
  font-size:11px;
  color:var(--muted);
  padding:24px 9px 9px;
}

.history{overflow:auto;flex:1;min-height:0}

.chatitem{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  color:#c9c5db;
  padding:11px 10px;
  border-radius:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.chatitem:hover,.chatitem.active{background:var(--panel2)}

.sidebottom{
  border-top:1px solid var(--border);
  padding-top:12px;
}

.iconbtn{
  border:0;
  background:transparent;
  padding:10px;
  border-radius:10px;
}

.iconbtn:hover{background:#29213f}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:62px;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.topbar span{font-size:13px;color:var(--muted)}
.status{color:#9de6bd!important;font-size:11px!important}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:28px 18px 20px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

.welcome{
  margin:auto;
  text-align:center;
  max-width:500px;
  padding:25px 10px;
}

.biglogo{
  width:110px;
  height:110px;
  object-fit:contain;
  margin:0 auto 22px;
  filter:drop-shadow(0 0 17px #9875ff77);
  animation:
    logo-arrive 1.25s cubic-bezier(.2,.8,.2,1) both,
    glow 2.5s 1.25s infinite alternate;
}

@keyframes logo-arrive{
  0%{
    opacity:0;
    transform:translateY(24px) rotate(-38deg) scale(.28);
  }
  65%{
    opacity:1;
    transform:translateY(-5px) rotate(375deg) scale(1.12);
  }
  82%{
    transform:translateY(2px) rotate(354deg) scale(.97);
  }
  100%{
    opacity:1;
    transform:translateY(0) rotate(360deg) scale(1);
  }
}

@keyframes glow{
  to{filter:drop-shadow(0 0 24px #9875ff)}
}

.welcome h1{
  font-size:34px;
  letter-spacing:5px;
  margin:0 0 12px;
}

.welcome p{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.suggestions{
  display:flex;
  gap:9px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:25px;
}

.suggestions button{
  background:var(--panel);
  border:1px solid var(--border);
  padding:10px 13px;
  border-radius:20px;
  color:#c9baff;
  font-size:12px;
}

.suggestions button:hover{
  border-color:var(--purple);
  background:#201a36;
}

.message{
  max-width:780px;
  width:100%;
  margin:0 auto;
  display:flex;
  gap:12px;
  line-height:1.7;
}

.avatar{
  width:30px;
  height:30px;
  flex-shrink:0;
  border-radius:50%;
  background:#28203e;
  display:grid;
  place-items:center;
  font-size:12px;
}

.message.user .avatar{background:#24243a}

.content{
  min-width:0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:14px;
}

.composer-area{
  flex-shrink:0;
  padding:12px 18px 18px;
}

.composer{
  max-width:780px;
  margin:auto;
  background:#141425;
  border:1px solid #393451;
  border-radius:20px;
  padding:12px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  box-shadow:0 8px 35px #0005;
}

textarea{
  flex:1;
  resize:none;
  max-height:140px;
  min-height:27px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:8px 5px;
  font-size:14px;
}

textarea::placeholder{color:#77748e}

.send{
  width:42px;
  height:42px;
  min-width:42px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#ff65c8,#a855f7,#7045ff);
  color:white;
  font-size:23px;
  font-weight:600;
  display:grid;
  place-items:center;
  transition:transform .2s;
}

.send:hover{transform:scale(1.08)}
.send:disabled{opacity:.5;cursor:not-allowed}

.note{
  text-align:center;
  color:#74718a;
  font-size:10px;
  padding-top:10px;
}

.overlay{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:5;
}

.overlay.show{display:flex}

.modal{
  width:100%;
  max-width:380px;
  background:#151527;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:0 18px 60px #0008;
}

.modal h2{margin-top:0}
.modal p{color:var(--muted);font-size:13px}
.modal label{font-size:12px;color:#aaa}

.modal input{
  width:100%;
  padding:11px;
  background:#090914;
  color:white;
  border:1px solid var(--border);
  border-radius:9px;
  margin-top:8px;
}

.modal-actions{display:flex;gap:10px;flex-wrap:wrap}

.modal button{
  background:var(--panel2);
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:9px;
  margin-top:12px;
}

@media(max-width:650px){
  .sidebar{
    position:fixed;
    z-index:4;
    top:0;
    bottom:0;
    left:-280px;
  }

  .sidebar.open{left:0}
  .topbar{padding:0 12px}
  .messages{padding:22px 13px}
  .composer-area{padding:10px 12px 15px}
  .welcome h1{font-size:29px}
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <img class="logo" src="axon-logo.png" alt="AXON logo">
      <strong>AXON</strong>
    </div>

    <button class="newchat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="sideheading">YOUR CONVERSATIONS</div>

    <div class="history" id="history"></div>

    <div class="sidebottom">
      <button class="chatitem" onclick="openSettings()">
        ⚙ Settings
      </button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div>
        <button class="iconbtn" onclick="toggleSidebar()">☰</button>
        <span>AXON / AI Chat</span>
      </div>
      <span class="status">● AI CHAT</span>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-area">
      <div class="composer">

        <textarea
          id="input"
          rows="1"
          placeholder="Message AXON..."
          oninput="resizeInput(this)"
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          class="send"
          id="send"
          onclick="sendMessage()"
          aria-label="Send message"
        >↑</button>

      </div>

      <div class="note">
        AXON can make mistakes. Verify important information.
      </div>
    </div>

  </main>
</div>

<div class="overlay" id="settings"
     onclick="if(event.target===this)closeSettings()">

  <div class="modal">
    <h2>Settings</h2>
    <p>AXON configuration</p>

    <label for="workerUrl">AI Worker URL</label>

    <input
      id="workerUrl"
      type="url"
      placeholder="Your Cloudflare Worker URL"
    >

    <div class="modal-actions">
      <button onclick="saveSettings()">Save settings</button>
      <button onclick="closeSettings()">Close</button>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const CHAT_KEY = "axon_chats";
const URL_KEY = "axon_worker_url";

function loadChats(){
  try{
    const saved = JSON.parse(
      localStorage.getItem(CHAT_KEY) || "[]"
    );

    return Array.isArray(saved)
      ? saved.filter(c => c && Array.isArray(c.messages))
      : [];

  }catch(error){
    console.warn("Could not load chats:",error);
    return [];
  }
}

let chats = loadChats();
let currentId = null;
let busy = false;

function save(){
  try{
    localStorage.setItem(CHAT_KEY,JSON.stringify(chats));
  }catch(error){
    console.error("Save error:",error);
  }
}

function currentChat(){
  return chats.find(c => c.id === currentId) || null;
}

function createChat(){
  const chat = {
    id:Date.now(),
    title:"New conversation",
    messages:[]
  };

  chats.unshift(chat);
  currentId = chat.id;

  return chat;
}

function newChat(){
  currentId = null;
  renderMessages();
  renderHistory();
  $("sidebar").classList.remove("open");
  $("input").focus();
}

function selectChat(id){
  currentId = id;
  renderMessages();
  renderHistory();
  $("sidebar").classList.remove("open");
}

function renderHistory(){
  const history = $("history");
  history.replaceChildren();

  chats.forEach(chat => {
    const button = document.createElement("button");

    button.className =
      "chatitem" +
      (chat.id === currentId ? " active" : "");

    button.textContent =
      "▢  " + (chat.title || "New conversation");

    button.onclick = () => selectChat(chat.id);
    history.appendChild(button);
  });
}

function welcomeMarkup(){
  return `
    <div class="welcome">
      <img class="biglogo" src="axon-logo.png" alt="AXON">
      <h1>AXON</h1>
      <p>
        Your AI conversation space.<br>
        Ask anything. Explore ideas. Learn something new.
      </p>
      <div class="suggestions">
        <button onclick="suggest('Explain artificial intelligence simply')">Explore AI</button>
        <button onclick="suggest('Help me learn coding')">Learn coding</button>
        <button onclick="suggest('Tell me an interesting science fact')">Science fact</button>
      </div>
    </div>`;
}

function renderMessages(){
  const area = $("messages");
  area.replaceChildren();

  const chat = currentChat();

  if(!chat || !chat.messages.length){
    area.innerHTML = welcomeMarkup();
    return;
  }

  chat.messages.forEach(message => {
    addMessage(message.role,message.text,false);
  });

  area.scrollTop = area.scrollHeight;
}

function addMessage(role,text,scroll=true){
  const row = document.createElement("div");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "You" : "A";

  const content = document.createElement("div");
  content.className = "content";
  content.textContent = text;

  row.append(avatar,content);
  $("messages").appendChild(row);

  if(scroll){
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  return content;
}

function suggest(text){
  $("input").value = text;
  sendMessage();
}

function resizeInput(element){
  element.style.height = "auto";
  element.style.height =
    Math.min(element.scrollHeight,140) + "px";
}

function handleKey(event){
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

async function sendMessage(){

  if(busy) return;

  const input = $("input");
  const text = input.value.trim();

  if(!text) return;

  const url =
    (localStorage.getItem(URL_KEY) || "").trim();

  if(!url){
    openSettings();
    alert("First add your Cloudflare Worker URL in Settings.");
    return;
  }

  busy = true;
  $("send").disabled = true;

  input.value = "";
  input.style.height = "27px";

  const chat = currentChat() || createChat();

  if(!chat.messages.length){
    chat.title = text.slice(0,35);
  }

  chat.messages.push({
    role:"user",
    text:text
  });

  addMessage("user",text);

  const reply = addMessage("assistant","Thinking...");

  const assistantMessage = {
    role:"assistant",
    text:""
  };

  chat.messages.push(assistantMessage);

  save();
  renderHistory();

  try{

    const apiMessages = chat.messages
      .slice(0,-1)
      .slice(-12)
      .map(message => ({
        role:message.role === "assistant"
          ? "assistant"
          : "user",
        content:message.text
      }));

    const response = await fetch(url,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        messages:apiMessages
      })
    });

    const data = await response.json().catch(() => ({}));

    if(!response.ok){
      throw new Error(
        data.details ||
        data.error ||
        ("Server error: " + response.status)
      );
    }

    const answer =
      data.response ||
      data.reply ||
      data.text ||
      data.result;

    if(typeof answer !== "string" || !answer.trim()){
      throw new Error(
        data.details ||
        data.error ||
        "No answer received from AI server."
      );
    }

    assistantMessage.text = answer.trim();
    reply.textContent = assistantMessage.text;

  }catch(error){

    const message =
      "AXON Error: " +
      (error && error.message
        ? error.message
        : "Unknown error");

    assistantMessage.text = message;
    reply.textContent = message;

    console.error("AXON request failed:",error);

  }finally{

    save();

    busy = false;
    $("send").disabled = false;

    $("messages").scrollTop =
      $("messages").scrollHeight;

    input.focus();
  }
}

function toggleSidebar(){
  $("sidebar").classList.toggle("open");
}

function openSettings(){
  $("workerUrl").value =
    localStorage.getItem(URL_KEY) || "";

  $("settings").classList.add("show");
}

function closeSettings(){
  $("settings").classList.remove("show");
}

function saveSettings(){
  const url = $("workerUrl").value.trim();

  if(url && !/^https:\/\/[^\s]+$/i.test(url)){
    alert("Please enter a valid HTTPS Worker URL.");
    return;
  }

  localStorage.setItem(URL_KEY,url);
  closeSettings();
  alert("Settings saved!");
}

renderMessages();
renderHistory();

</script>
</body>
</html>
